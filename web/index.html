<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gambas — a distributed pixel canvas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23222'/><rect x='2' y='2' width='4' height='4' fill='%23E50000'/><rect x='6' y='6' width='4' height='4' fill='%2302BE01'/><rect x='10' y='10' width='4' height='4' fill='%230083C7'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>gambas</h1>
      <p class="tagline">a distributed pixel canvas &mdash; every replica is a Raft node</p>
      <div id="conn" class="conn" title="connection">●</div>
    </header>

    <main>
      <canvas id="canvas"></canvas>
      <div id="coords" class="coords"></div>
      <div id="toast" class="toast" hidden></div>
    </main>

    <footer>
      <div id="palette" class="palette"></div>
      <div class="statusbar">
        <span id="cooldown" class="cooldown"></span>
        <span id="node" class="node"></span>
        <a href="https://github.com/cacdu/gambas" target="_blank" rel="noreferrer">source</a>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
