name: Deploy

# Runs only after the CI workflow succeeds on main, and only once deploys are
# switched on. To enable after the Fly bootstrap:
#   1. fly tokens create deploy -a gambas   → repo secret FLY_API_TOKEN
#   2. set repo variable DEPLOY_ENABLED=true
# Until DEPLOY_ENABLED is set, this job is skipped (never fails a build).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: ./deploy/fly-deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
