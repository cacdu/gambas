upstream gambas {
    # Any replica serves reads, paints, and WebSockets; writes are forwarded
    # to the Raft leader internally.
    server gambas1:8080;
    server gambas2:8080;
    server gambas3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://gambas;
        proxy_http_version 1.1;
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        # Real client IP for the paint cooldown (nodes run --behind-proxy)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
